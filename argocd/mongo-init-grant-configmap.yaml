apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init-grant
data:
  init-mongo.sh: |
    #!/bin/bash
    if which mongosh > /dev/null 2>&1; then
      mongo_init_bin='mongosh'
    else
      mongo_init_bin='mongo'
    fi
    "${mongo_init_bin}" <<EOF
    use ${MONGO_AUTHSOURCE}
    db.auth("${MONGODB_INITDB_ROOT_USERNAME}", "${MONGODB_INITDB_ROOT_PASSWORD}")
    db.createUser({
      user: "${MONGODB_USER}",
      pwd: "${MONGODB_PASS}",
      roles: [
        { db: "${MONGODB_DBNAME}", role: "dbOwner" },
        { db: "${MONGODB_DBNAME}_stat", role: "dbOwner" },
        { db: "${MONGODB_DBNAME}_audit", role: "dbOwner" }
      ]
    })
    EOF